<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Logo de la Liga de Videojuegos Canaria">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d91"/>
      <stop offset="1" stop-color="#1e88e5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" rx="24" fill="url(#fondo)"/>
  <!-- mando -->
  <g transform="translate(70 80)">
    <rect x="0" y="20" width="200" height="110" rx="55" fill="#ffd54f"/>
    <rect x="40" y="62" width="50" height="16" rx="4" fill="#0b3d91"/>
    <rect x="57" y="45" width="16" height="50" rx="4" fill="#0b3d91"/>
    <circle cx="140" cy="60" r="11" fill="#0b3d91"/>
    <circle cx="165" cy="85" r="11" fill="#0b3d91"/>
  </g>
  <!-- olas -->
  <path d="M0 255 Q100 225 200 255 T400 255 T600 255 T800 255 V300 H0 Z" fill="#ffd54f" opacity=".35"/>
  <text x="310" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Liga Canaria</text>
  <text x="312" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#ffd54f">de Videojuegos</text>
</svg>
